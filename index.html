<head>

  <script>
    tailwind = window.tailwind || {};
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { DEFAULT: '#171717', hover: '#000000', soft: '#F1F1EF', accent: '#B9683C' } },
          fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Space Grotesk', 'sans-serif'] },
          borderRadius: { 'card': '20px', 'control': '14px', 'button': '12px' },
          boxShadow: { soft: '0 18px 45px rgba(44, 35, 103, 0.10)', lift: '0 20px 50px rgba(44, 35, 103, 0.16)' }
        }
      }
    };
  </script>
  <script>
    // Runtime config (override before api.js loads if needed).
    window.API_BASE = window.API_BASE || 'https://workspot-backend.onrender.com/api';
    window.GOOGLE_CLIENT_ID = window.GOOGLE_CLIENT_ID || '294682814437-d5u6trnt40ijfiq09o9m1ptlj8h4iavk.apps.googleusercontent.com';
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: #FAFAF8; overflow-x: hidden; }
    .font-display { font-family: 'Space Grotesk', sans-serif; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(23, 23, 23, .28); outline-offset: 2px; }
    ::selection { background: #E8D8CA; color: #171717; }
    /* Fallbacks for design tokens used by the external JSX bundle. */
    .bg-brand { background-color: #171717 !important; }
    .bg-brand-soft { background-color: #F1F1EF !important; }
    .text-brand { color: #171717 !important; }
    .border-brand { border-color: #171717 !important; }
    .hover\:bg-brand-hover:hover { background-color: #000000 !important; }
    .hover\:text-brand:hover { color: #171717 !important; }
    .focus\:border-brand:focus { border-color: #171717 !important; }
    .text-brand-accent { color: #B9683C !important; }
    .bg-brand-accent { background-color: #B9683C !important; }
    .border-brand-accent { border-color: #B9683C !important; }

    /* ===== Scroll-reveal (gated on reduced-motion) ===== */
    .reveal { opacity: 0; transform: translateY(26px); transition: opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1); will-change: opacity, transform; }
    .reveal.is-visible { opacity: 1; transform: none; }
    .reveal-d1 { transition-delay: .08s; }
    .reveal-d2 { transition-delay: .16s; }
    .reveal-d3 { transition-delay: .24s; }
    .reveal-d4 { transition-delay: .32s; }

    /* ===== Editorial underline sweep for links ===== */
    .link-sweep { position: relative; }
    .link-sweep::after { content: ''; position: absolute; left: 0; bottom: -2px; width: 100%; height: 1.5px; background: currentColor; transform: scaleX(0); transform-origin: right; transition: transform .4s cubic-bezier(.22,1,.36,1); }
    .link-sweep:hover::after { transform: scaleX(1); transform-origin: left; }

    /* ===== Custom cursor (desktop, motion-on only) ===== */
    .ws-cursor-dot, .ws-cursor-ring { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999; border-radius: 9999px; mix-blend-mode: difference; opacity: 0; }
    .ws-cursor-on .ws-cursor-dot, .ws-cursor-on .ws-cursor-ring { opacity: 1; }
    .ws-cursor-dot { width: 6px; height: 6px; background: #fff; transform: translate(-50%, -50%); transition: opacity .3s ease; }
    .ws-cursor-ring { width: 34px; height: 34px; border: 1.5px solid #fff; transform: translate(-50%, -50%); transition: width .25s ease, height .25s ease, opacity .3s ease, background-color .25s ease; }
    .ws-cursor-ring.ws-cursor-hover { width: 52px; height: 52px; background: rgba(255,255,255,.12); }
    body.ws-cursor-on, body.ws-cursor-on * { cursor: none !important; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
      .ws-cursor-dot, .ws-cursor-ring { display: none !important; }
      body.ws-cursor-on, body.ws-cursor-on * { cursor: auto !important; }
    }
    @media (hover: none), (pointer: coarse) {
      .ws-cursor-dot, .ws-cursor-ring { display: none !important; }
      body.ws-cursor-on, body.ws-cursor-on * { cursor: auto !important; }
    }
  </style>
</head>

</body>
</html>
