<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkSpot - Find & Book Workspaces Near You</title>
  <script>
    tailwind = window.tailwind || {};
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { DEFAULT: '#6D5EF9', hover: '#5B4EF2', soft: '#F0EEFF' } },
          borderRadius: { 'card': '20px', 'control': '14px', 'button': '12px' },
          boxShadow: { soft: '0 18px 45px rgba(44, 35, 103, 0.10)', lift: '0 20px 50px rgba(44, 35, 103, 0.16)' }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: #F8FAFC; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(109, 94, 249, .32); outline-offset: 2px; }
    ::selection { background: #DCD8FF; color: #111827; }
    /* Fallbacks for design tokens used by the external JSX bundle. */
    .bg-brand { background-color: #6D5EF9 !important; }
    .bg-brand-soft { background-color: #F0EEFF !important; }
    .text-brand { color: #6D5EF9 !important; }
    .border-brand { border-color: #6D5EF9 !important; }
    .hover\:bg-brand-hover:hover { background-color: #5B4EF2 !important; }
    .hover\:text-brand:hover { color: #6D5EF9 !important; }
    .focus\:border-brand:focus { border-color: #6D5EF9 !important; }
  </style>
</head>
<body class="bg-white text-gray-900 antialiased">
  <div id="root"></div>
  <script src="assets/js/api.js"></script>
  <script type="text/babel" src="assets/js/app.js"></script>
</body>
</html>
